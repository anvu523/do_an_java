services:
  mysql:
    image: mysql:8.4
    container_name: drink-store-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - ./database/my.cnf:/etc/mysql/conf.d/charset.cnf:ro
      - ./database/drink_store.sql:/docker-entrypoint-initdb.d/01_drink_store.sql:ro
      - ./database/seed_demo_orders.sql:/docker-entrypoint-initdb.d/02_seed_demo_orders.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: drink-store-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ""
      UPLOAD_LIMIT: 64M
